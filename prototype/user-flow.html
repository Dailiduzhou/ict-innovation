<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<title>AgeGuard · 用户交互流程（设计原型）</title>
<style>
/* ============ 画布 ============ */
:root{
  --paper:#f7f5f0; --card:#fff; --line:#e2ddd1; --ink:#1c2420; --sub:#6f7a75;
  --green:#157f5b; --green-d:#0f6649;
  --blue:#26509a; --blue-bg:#edf2fb; --blue-line:#c6d5ee;
  --grey:#5d6763; --grey-line:#d6dad7;
  --amber:#7d5b12; --amber-bg:#fdf5e3; --amber-line:#ead9b0;
  --me:#2f6b5e;
  --cool-bg:#f1f4f7; --cool-ink:#1e2a33; --cool-line:#dce4ea; --cool-sub:#5d7284;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);
  background:#e9edf3;
  background-image:radial-gradient(#c9d2de 1px,transparent 1px);
  background-size:14px 14px;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer}

/* ============ 顶栏 ============ */
.topbar{
  display:flex;align-items:center;gap:18px;padding:10px 20px;
  background:rgba(255,255,255,.86);border-bottom:1px solid #d7dee8;
  backdrop-filter:blur(8px);position:sticky;top:0;z-index:30;
}
.tb-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.tb-title b{font-size:14px;letter-spacing:.1px}
.tb-title span{font-size:11.5px;color:#6b7785}
.legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:#4d5a68;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.g{background:var(--green)}
.sw.b{background:var(--blue);opacity:.85}
.sw.n{background:#f1f2f1;border:1.5px solid #b9c0bd}

/* ============ 舞台 ============ */
.stage{
  display:flex;gap:26px;justify-content:center;align-items:flex-start;
  padding:22px 20px 26px;min-height:calc(100vh - 58px);
}
.device-col{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0}
.preview-label{
  font-family:var(--mono);font-size:11px;color:#5c6b7c;
  display:flex;gap:12px;align-items:center;letter-spacing:.02em;
}
.preview-label i{font-style:normal;color:#8a97a6}
.device-wrap{position:relative}
.device{
  box-sizing:content-box;width:412px;height:915px;padding:9px;
  border-radius:46px;transform-origin:top left;
  background:linear-gradient(155deg,#2b3138,#12161a);
  box-shadow:0 26px 56px rgba(23,33,48,.30),inset 0 0 0 1px rgba(255,255,255,.13);
}
.screen{
  position:relative;width:412px;height:915px;border-radius:38px;overflow:hidden;
  background:var(--paper);display:flex;flex-direction:column;
}
.punch{position:absolute;top:17px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#0b0e11;z-index:9}

/* ============ 控制条 ============ */
.controls{
  display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid #dbe2ea;border-radius:999px;padding:6px 8px;
  box-shadow:0 8px 24px rgba(25,35,50,.09);
}
.nav{
  width:42px;height:42px;border-radius:50%;border:1px solid #dbe2ea;background:#fff;
  font-size:17px;line-height:1;display:grid;place-items:center;color:#2b3a48;padding:0;
}
.nav:active{background:#eef3f8}
.counter{font-family:var(--mono);font-size:12px;color:#54616f;min-width:62px;text-align:center}
.progress{width:110px;height:4px;background:#e5eaf1;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--me);transition:width .18s ease}
.iconbtn{
  border:1px solid #dbe2ea;background:#fff;border-radius:999px;height:42px;padding:0 14px;
  font-size:12.5px;color:#41505e;display:flex;align-items:center;gap:6px;
}
.iconbtn[aria-pressed="true"]{background:#eef7f2;border-color:#b9d9c9;color:#0f6649}
.mobile-only{display:none}

/* ============ 说明面板 ============ */
.notes{
  width:344px;flex-shrink:0;position:sticky;top:76px;
  max-height:calc(100vh - 104px);overflow:auto;
  background:#fff;border:1px solid #dbe2ea;border-radius:18px;
  padding:20px 20px 18px;box-shadow:0 14px 34px rgba(25,35,50,.07);
}
.notes-head{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid #edf1f5}
.stepno{
  font-family:var(--mono);font-size:12px;font-weight:700;color:#fff;background:#2b3a48;
  border-radius:9px;padding:6px 8px;line-height:1;flex-shrink:0;margin-top:2px;
}
.nk{font-size:11.5px;color:#67737f;letter-spacing:.02em}
.notes h2{font-size:17px;line-height:1.35;margin:3px 0 0;letter-spacing:.01em}
.nsec{margin-top:16px}
.nsec h3{font-size:11.5px;letter-spacing:.12em;color:#6c7886;margin:0 0 8px;font-weight:700}
.nsec ul{margin:0;padding-left:16px}
.nsec li{font-size:13px;line-height:1.62;color:#38434f;margin-bottom:5px}
.nsec li::marker{color:#a9b4c0}
.ncontrast{margin-top:16px;border:1px dashed #cfd8e2;border-radius:12px;padding:12px;background:#f7f9fb}
.mini-label{font-size:11px;letter-spacing:.04em;color:#7c8b99;margin-bottom:6px;font-weight:700}
.mini-body{font-size:12.5px;line-height:1.6;color:#3b4753}
.nfoot{margin-top:18px;padding-top:12px;border-top:1px solid #edf1f5;font-size:11.5px;line-height:1.6;color:#737f8b}
.notes-close{margin-top:16px}
.nsclose{display:none;margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid #dbe2ea;background:#fff;color:#41505e;font-size:18px;line-height:1;place-items:center;flex-shrink:0;padding:0}
.nlegend{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#3b4753}
.nlegend div{display:flex;gap:8px;align-items:center}

/* ============ 手机通用 ============ */
.phone{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45}
.statusbar{
  height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:13px;font-weight:600;color:#3d4b46;
}
.sbicons{display:flex;align-items:center;gap:5px;color:#3d4b46}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:2px 18px 10px;gap:10px}
.brand{font-weight:800;font-size:18.5px;letter-spacing:.2px;white-space:nowrap}
.brand.sub{font-size:16.5px;overflow:hidden;text-overflow:ellipsis}
.navback{font-size:26px;line-height:1;color:#4a5a54;width:28px;flex-shrink:0}
.ghostlink{
  font-size:14px;color:#40564f;padding:7px 12px;border:1px solid #d8d2c4;border-radius:999px;
  background:#fff;white-space:nowrap;
}
.ghostlink.tiny{font-size:12.5px;padding:6px 10px;color:#8a8171;border-color:transparent;background:transparent}
.pad{padding-left:18px;padding-right:18px}
.fill{flex:1}
.h1{font-size:25px;line-height:1.32;margin:8px 0 10px;letter-spacing:.01em}
.lead{font-size:16.5px;line-height:1.6;color:#4b5752;margin:0 0 16px}
.fine{font-size:13px;line-height:1.55;color:#6b7671;margin:12px 0 0}
.fine.center{text-align:center;margin:12px 18px 0}
.tiny{font-size:13.5px;color:#7b8782}

/* 首页 / 对话 */
.today{
  margin:0 18px 10px;padding:10px 14px;border-radius:14px;background:#fff;
  border:1px solid #e6e1d5;font-size:14.5px;color:#3c4a45;
  display:flex;gap:9px;align-items:center;
}
.tdot{width:7px;height:7px;border-radius:50%;background:#b8b09c;flex-shrink:0}
.chat{
  flex:1;min-height:0;overflow:auto;padding:2px 18px 8px;
  display:flex;flex-direction:column;gap:13px;justify-content:flex-start;
}
.msg{display:flex;flex-direction:column;gap:5px;max-width:100%}
.msg.me{align-items:flex-end}
.msg.ai{align-items:flex-start}
.bubble{
  max-width:84%;padding:12px 15px;border-radius:18px;font-size:16.5px;line-height:1.5;
  word-break:break-word;
}
.me .bubble{background:var(--me);color:#fff;border-bottom-right-radius:6px}
.ai .bubble{background:#fff;border:1px solid #e6e1d5;border-bottom-left-radius:6px}
.meta{font-size:11.5px;color:#6f7a75;padding:0 4px}
.msg.me .meta{text-align:right}
mark{background:#d8efdf;color:inherit;border-radius:4px;padding:0 2px}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:16px;margin-right:6px;vertical-align:-3px}
.wave i{width:3px;background:currentColor;border-radius:2px;opacity:.92}
.chip{
  align-self:flex-start;font-size:12.5px;padding:6px 10px;border-radius:999px;
  background:#f1f0ea;color:#5f6a65;border:1px solid #e0ddd2;display:inline-flex;gap:6px;align-items:center;
}
.chip.ok{background:#eaf5ef;border-color:#c3ddd0;color:#0f6649}
.chip.blue{background:var(--blue-bg);border-color:var(--blue-line);color:#224a8d}
.chip.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.statuspill{
  align-self:flex-start;display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;color:#6d7873;background:#f3f1ea;border:1px solid #e2ddd1;
  border-radius:999px;padding:6px 11px;
}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid #cfd8d3;border-top-color:#7b8d85;animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ce0bd;margin-right:8px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

/* 底部输入条：文字 + 语音 */
.composer{flex:0 0 auto;padding:8px 16px 14px;display:flex;flex-direction:column;gap:7px;background:var(--paper)}
.inputrow{display:flex;gap:9px;align-items:center}
.textfield{
  flex:1;min-height:54px;border-radius:16px;border:1px solid #dcd7c9;background:#fff;
  display:flex;align-items:center;padding:0 16px;font-size:16px;color:#8a948f;line-height:1.3;
}
.micbtn{
  width:54px;height:54px;border-radius:16px;background:var(--me);color:#fff;border:none;
  display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 18px rgba(47,107,94,.18);padding:0;
}
.micbtn:active{background:var(--green-d)}
.inputbar{
  width:100%;min-height:58px;border-radius:18px;border:1px solid #2f6b5e;background:#e7f2ec;
  display:flex;align-items:center;gap:12px;padding:0 14px 0 16px;color:#1d5b49;
  font-size:15.5px;font-weight:700;text-align:left;font-family:inherit;line-height:1.3;
}
.bars{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;width:26px;flex-shrink:0}
.bars i{width:4px;border-radius:3px;background:#1d6b52;height:9px;animation:bars 1.05s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.18s}
.bars i:nth-child(3){animation-delay:.36s}
@keyframes bars{0%,100%{height:8px}50%{height:27px}}
.livetext{flex:1;min-width:0}
.stopmark{
  width:34px;height:34px;border-radius:10px;background:#1d5b49;color:#fff;flex-shrink:0;
  display:grid;place-items:center;font-size:10px;line-height:1;
}
.chint{font-size:12px;color:#6f7a75;text-align:center;line-height:1.45}
.mic-round{
  width:156px;height:156px;border-radius:50%;border:none;background:var(--me);color:#fff;
  font-size:20px;font-weight:800;box-shadow:0 18px 34px rgba(47,107,94,.28),0 0 0 12px rgba(47,107,94,.08);
  display:grid;place-items:center;margin:26px auto 0;
}
.mic-round:active{background:var(--green-d)}

/* 引导 */
.onboard{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 34px 34px;text-align:center}
.mark{
  width:62px;height:62px;border-radius:20px;margin:0 auto 26px;background:#fff;
  border:1px solid #ded8ca;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(60,70,60,.08);
}
.mark::after{content:"";width:22px;height:22px;border-radius:50%;background:var(--me);box-shadow:0 0 0 7px rgba(47,107,94,.15)}
.onboard h1{font-size:28px;line-height:1.3;margin:0 0 12px;letter-spacing:.01em}
.onboard .lead{font-size:16px;color:#57635e}
.osdialog{
  margin:0 14px 16px;background:#fff;border-radius:22px;padding:20px;
  border:1px solid #e0dbd0;box-shadow:0 18px 40px rgba(40,50,45,.16);
}
.os-kicker{font-size:11.5px;letter-spacing:.14em;color:#98a29d;margin-bottom:8px}
.os-title{font-size:17.5px;font-weight:800;line-height:1.4;margin-bottom:8px}
.os-body{font-size:14px;line-height:1.6;color:#5a6661;margin-bottom:14px}
.os-actions{display:flex;flex-direction:column;gap:8px}

/* 信息列表 */
.list{flex:1;min-height:0;overflow:auto;padding:4px 18px 0;display:flex;flex-direction:column;gap:12px}
.info{display:flex;gap:13px;background:#fff;border:1px solid #e6e1d5;border-radius:16px;padding:14px}
.ico{font-size:20px;line-height:1.2;width:26px;flex-shrink:0;text-align:center}
.info b{font-size:16px;display:block;margin-bottom:4px}
.info p{font-size:13.5px;line-height:1.55;color:#6a7570;margin:0}
.switchcard{
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  background:#fff;border:1px solid #e6e1d5;border-radius:16px;padding:15px;
}
.switchcard b{font-size:15.5px;display:block;margin-bottom:4px}
.switchcard p{font-size:13px;line-height:1.5;color:#6a7570;margin:0;max-width:230px}
.switch{width:52px;height:30px;border-radius:99px;background:#ded9cc;position:relative;flex-shrink:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on i{left:25px}

/* 卡片 */
.shelf{flex:0 0 auto;position:relative;padding-top:2px}
.shelf::before{
  content:"";position:absolute;left:18px;right:18px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,#ded7c8 18%,#ded7c8 82%,transparent);
}
.shelf .card{margin:8px 16px 6px}
.shelf.collapsed .card{display:none}
.shelf .traychip{display:none}
.shelf.collapsed .traychip{display:flex}
.traychip{
  margin:6px 16px 8px;align-items:center;gap:10px;cursor:pointer;
  background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:14px;
  padding:10px 12px;font-size:13px;color:#6b5a2e;
}
.card{
  margin:0 16px 10px;background:#fff;border:1px solid #ddd7c9;border-radius:20px;
  padding:16px;box-shadow:0 10px 26px rgba(40,50,45,.08);
}
.card-kicker{
  font-size:11.5px;letter-spacing:.1em;color:#786c53;font-weight:800;
  display:flex;align-items:center;gap:7px;margin-bottom:7px;
}
.collapse{
  margin-left:auto;border:1px solid #e4dfd2;background:#faf8f3;color:#6f6550;
  font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;
  display:flex;align-items:center;gap:3px;min-height:30px;
}
.collapse::after{content:"⌄";font-size:14px;line-height:1;margin-top:-2px}

.card-kicker::before{content:"";width:6px;height:6px;border-radius:50%;background:#c9a75f}
.card-title{font-size:19.5px;font-weight:800;line-height:1.38;margin-bottom:8px;letter-spacing:.01em}
.quote{
  margin:10px 0;padding:10px 12px;border-left:3px solid #cfd8d4;background:#f7f8f5;
  border-radius:0 10px 10px 0;font-size:15px;line-height:1.55;color:#3b4742;
}
.card-meta{font-size:12.5px;line-height:1.5;color:#67726d;margin-bottom:12px}
.actions{display:flex;flex-direction:column;gap:8px}
.actions.pad{padding:0 18px 18px}
.btn{
  min-height:52px;border-radius:14px;font-size:17px;font-weight:700;border:1px solid transparent;
  background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;
  line-height:1.3;
}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:active{background:var(--green-d)}
.btn.secondary{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.btn.secondary:active{background:#e2ebf9}
.btn.ghost{background:#f1f2f1;border-color:#d3d8d5;color:#4f5a56}
.btn.ghost:active{background:#f4f5f4}

/* 等你决定 */
.tray{
  flex:0 0 auto;cursor:pointer;margin:4px 16px 8px;display:flex;align-items:center;gap:10px;
  background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:14px;
  padding:10px 12px;font-size:13px;color:#6b5a2e;
}
.tray .tlabel,.traychip .tlabel{background:#fff;border:1px solid var(--amber-line);border-radius:999px;padding:4px 9px;font-weight:800;font-size:11.5px;color:var(--amber);white-space:nowrap}
.tray .ttext,.traychip .ttext{flex:1;font-weight:700;font-size:14px;color:#4f4426;line-height:1.35}
.tray .tgo,.traychip .tgo{font-size:18px;color:#a08a4d;padding:0 2px}

/* 到点提醒 */
.phone.reminder{background:radial-gradient(120% 80% at 50% 0%,#eef5f0 0%,var(--paper) 62%)}
.rem{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 26px;gap:12px}
.rem-time{font-size:14px;letter-spacing:.12em;color:#7b8883;font-weight:700}
.rem-title{font-size:38px;font-weight:800;line-height:1.2;letter-spacing:.01em}
.rem-sub{font-size:15px;color:#6a7570;line-height:1.5}
.rem-voice{
  margin-top:6px;border:1px solid #d8d2c4;background:#fff;border-radius:999px;
  padding:10px 18px;font-size:14.5px;color:#3f514a;display:inline-flex;gap:8px;align-items:center;
}

/* 子女端 */
.phone.child{background:var(--cool-bg);color:var(--cool-ink)}
.chead{display:flex;align-items:center;gap:12px;padding:2px 18px 12px}
.chead.back{gap:6px}
.avatar{width:44px;height:44px;border-radius:14px;background:#2c3d4b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;flex-shrink:0}
.cwho{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cwho b{font-size:17px;letter-spacing:.01em}
.cwho span{font-size:12px;color:var(--cool-sub)}
.dots{color:#8b9aa7;font-size:18px;letter-spacing:1px}
.cback{width:30px;height:30px;border:none;background:transparent;font-size:26px;line-height:1;color:#3d5162;padding:0;flex-shrink:0}
.req{
  margin:0 16px 12px;display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid #f0d9cd;border-left:4px solid #b4532a;
  border-radius:14px;padding:12px;box-shadow:0 6px 16px rgba(40,60,80,.06);
}
.reqdot{width:8px;height:8px;border-radius:50%;background:#b4532a;flex-shrink:0}
.reqtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.reqtext b{font-size:15px}
.reqtext span{font-size:12px;color:var(--cool-sub)}
.reqsub{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.reqgo{font-size:20px;color:#7c8b99}
.csection{padding:2px 18px 8px;font-size:12px;letter-spacing:.12em;color:#7c8b99;font-weight:800;display:flex;align-items:center;gap:7px}
.csection::before{content:"";width:7px;height:7px;border-radius:2px;background:#2f8064}
.taglegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:#67757f;padding:4px 4px 2px}
.taglegend span{display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block;flex-shrink:0}
.dot.g{background:#2f8064}.dot.b{background:#2f5f8a}.dot.y{background:#a87b1e}.dot.o{background:#b4532a}.dot.n{background:#8b9aa7}

<body>
<noscript><p style="padding:16px;font:14px/1.6 system-ui">这份原型需要启用 JavaScript 才能查看。</p></noscript>

<header class="topbar">
  <div class="tb-title">
    <b>AgeGuard · 用户交互流程</b>
    <span>设计原型 · 人物与对话虚构 · 未实现、未验证</span>
  </div>
  <div class="legend" aria-label="按钮颜色约定">
    <span><i class="sw g"></i>是 / 同意</span>
    <span><i class="sw b"></i>更改 / 换方式</span>
    <span><i class="sw n"></i>否 / 不用</span>
  </div>
</header>

<main class="stage">
  <div class="device-col">
    <div class="preview-label"><span>Preview</span><i>Pixel 7 · 412 × 915 dp</i><i id="zoom">75%</i></div>
    <div class="device-wrap" id="wrap">
      <div class="device" id="device">
        <div class="punch"></div>
        <div class="screen" id="screen"></div>
      </div>
    </div>
    <div class="controls">
      <button class="nav" id="prev" aria-label="上一屏">‹</button>
      <div class="counter" id="counter">01 / 21</div>
      <button class="nav" id="next" aria-label="下一屏">›</button>
      <div class="progress"><i id="bar"></i></div>
      <button class="iconbtn" id="play" aria-pressed="false">▶ 自动</button>
      <button class="iconbtn mobile-only" id="notesBtn">说明</button>
    </div>
  </div>

  <aside class="notes" id="notes" aria-live="polite"></aside>
</main>
<div class="notes-backdrop" id="backdrop"></div>

<script>
/* ============================================================
   AgeGuard 交互流程原型
   21 屏 · 单文件 · 无外部依赖
   ============================================================ */

const MIC = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>';
const SB = `<div class="statusbar"><span>{{T}}</span><span class="sbicons">
<svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><rect x="0" y="7" width="2.5" height="4" rx=".8"/><rect x="4" y="5" width="2.5" height="6" rx=".8"/><rect x="8" y="2.5" width="2.5" height="8.5" rx=".8"/><rect x="12" y="0" width="2.5" height="11" rx=".8"/></svg>
<svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1 3.6a9 9 0 0 1 13 0"/><path d="M3.6 6.2a5.4 5.4 0 0 1 7.8 0"/><circle cx="7.5" cy="9" r=".9" fill="currentColor" stroke="none"/></svg>
<svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x=".6" y=".6" width="18.5" height="9.8" rx="2.6" stroke="currentColor" stroke-opacity=".5"/><rect x="2.2" y="2.2" width="13.5" height="6.6" rx="1.6" fill="currentColor"/><path d="M20.6 3.4v4.2a2.3 2.3 0 0 0 0-4.2z" fill="currentColor" fill-opacity=".5"/></svg>
</span></div>`;

const phone = (inner, cls='') => `<div class="phone ${cls}">${SB}${inner}</div>`;
const elderTop = (right='我记住的事') => `<div class="appbar"><div class="brand">AgeGuard</div><span class="ghostlink">${right}</span></div>`;
const ai = (t, meta='助理') => `<div class="msg ai"><div class="bubble">${t}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
const me = (t, meta='') => `<div class="msg me"><div class="bubble">${t}</div>${meta?`<div class="meta">${meta}</div>`:''}</div>`;
const chip = (t, cls='') => `<div class="chip ${cls}">${t}</div>`;
const pill = (t, cls='') => `<div class="statuspill ${cls}">${t}</div>`;
const b = (label, kind='primary', goto) => `<button class="btn ${kind}"${goto?` data-goto="${goto}"`:''}>${label}</button>`;
const act = (...btns) => `<div class="actions">${btns.join('')}</div>`;
const composer = (goto, mode='idle', hint='点麦克风说话，也可以打字') => {
  if(mode==='live') return `
    <div class="composer">
      <button type="button" class="inputbar" ${goto?`data-goto="${goto}"`:''}>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="livetext">正在听… 说完了点这里</span>
        <span class="stopmark">■</span>
      </button>
      ${hint?`<div class="chint">${hint}</div>`:''}
    </div>`;
  return `
    <div class="composer">
      <div class="inputrow">
        <div class="textfield" role="textbox" aria-readonly="true">也可以打字…</div>
        <button type="button" class="micbtn" ${goto?`data-goto="${goto}"`:''} aria-label="开始说话">${MIC}</button>
      </div>
      ${hint?`<div class="chint">${hint}</div>`:''}
    </div>`;
};
const card = (kicker, title, body, buttons, trayLabel) => `
  <div class="shelf">
    <div class="card">
      <div class="card-kicker"><span>${kicker}</span><button type="button" class="collapse" data-collapse>收起</button></div>
      <div class="card-title">${title}</div>${body}${act(...buttons)}
    </div>
    <div class="traychip" data-expand><span class="tlabel">等你决定 · 1</span><span class="ttext">${trayLabel||title}</span><span class="tgo">›</span></div>
  </div>`;

/* ---------------------------- 各屏 ---------------------------- */
const F = [];

/* 01 */
F.push({
  time:'15:02',
  who:'老人端 · 第一次打开',
  title:'打开就能说，不用先学',
  screen: phone(`
    <div class="onboard">
      <div class="mark"></div>
      <h1>有事，说一声就行</h1>
      <p class="lead">不用学怎么用。<br>点下面的大圆键，想说什么就说什么。</p>
      <button class="mic-round" data-goto="2">${MIC}<br>开始说话</button>
      <p class="fine">只有你点开的时候才会听</p>
      <p class="tiny" style="margin-top:22px;color:#8a948f">已经用过？用手机号登录</p>
    </div>`),
  why:[
    '打开即说话，不需要先选择“聊天／提醒／待办”功能，也不要求先绑定子女或设备。',
    '首屏只承诺一件事：点一下就能说。价值主张放在后面由对话体现。',
    '“只有你点开的时候才会听”直接写在首屏，避免把全双工理解成全天监听。'
  ],
  edge:[
    '首次点“开始说话”才触发系统麦克风权限，不在安装时静默申请。',
    '拒绝麦克风仍可使用文字输入与查看提醒，不把语音做成唯一路径。',
    '不在这里要求老人填写健康、年龄、病史等表单。'
  ]
});

/* 02 */
F.push({
  time:'15:02',
  who:'老人端 · 首次使用',
  title:'第一次讲清：什么时候在听',
  screen: phone(`
    <div class="appbar"><span class="navback">‹</span><div class="brand sub">开始之前</div><span class="ghostlink tiny">跳过</span></div>
    <div class="list">
      <div class="info"><span class="ico">🎙</span><div><b>只有你点开的时候才会听</b><p>点一下就停。说的时候，屏幕上方一直显示“正在听”，不会偷偷录。</p></div></div>
      <div class="info"><span class="ico">📝</span><div><b>说过的话会变成文字</b><p>为了下次还能接着聊。你说“这段别存”，这段就不存。</p></div></div>
      <div class="info"><span class="ico">🔔</span><div><b>到时间的提醒会响</b><p>提醒只在这个手机上响。手机没网时，我会告诉你没送到。</p></div></div>
    </div>
    <div class="osdialog">
      <div class="os-kicker">系统</div>
      <div class="os-title">允许「AgeGuard」使用麦克风？</div>
      <div class="os-body">只在你点开说话时使用。你随时可以在手机设置里关掉。</div>
      <div class="os-actions">${b('允许','primary',3)}${b('不允许','ghost',3)}</div>
    </div>`),
  why:[
    '把三个最容易误解的点一次讲清：何时录音、话怎么存、提醒怎么响；其余设置以后再说。',
    '系统权限弹窗用系统口吻呈现，说明与权限放在同一屏，避免老人不知道“允许”意味着什么。',
    '“这段别存”是可见的、可说的控制手段，不是藏在设置里的开关。'
  ],
  edge:[
    '不允许麦克风时不进入死循环；可继续用文字，并保留查看提醒的能力。',
    '录音指示必须常驻可见，不能只在设置页说明。',
    '不承诺“一定送到”：手机后台、网络与通知权限都存在限制。'
  ]
});

/* 03 */
F.push({
  time:'15:03',
  who:'老人端 · 家人共享设置',
  title:'共享默认关闭，随时可跳过',
  screen: phone(`
    <div class="appbar"><span class="navback">‹</span><div class="brand sub">家人能看到什么</div><span class="ghostlink tiny">跳过</span></div>
    <div class="pad">
      <h1 class="h1">要不要让小林<br>看到一点近况？</h1>
      <p class="lead">她能看到你愿意分享的一两句话，和可以接着聊的话题。看不到你全部的聊天。</p>
      <div class="switchcard">
        <div><b>让小林看到我分享的内容</b><p>默认关闭。每次分享前，还会再问你一次。</p></div>
        <div class="switch off" aria-label="当前关闭"><i></i></div>
      </div>
      <p class="fine">你不同意分享的内容，她那边不会有任何提示。</p>
    </div>
    <div class="fill"></div>
    <div class="actions pad">
      ${b('让小林看一点','primary',4)}
      ${b('先只给我自己用','ghost',4)}
    </div>`),
  why:[
    '独立模式必须成立：跳过这一步，老人仍然能用完整的对话、记忆与提醒。',
    '默认关闭，且明确“每次分享前还会再问一次”，把类别授权与逐次确认结合起来。',
    '把“她看不到全部聊天”写在开启之前，而不是开启之后。'
  ],
  edge:[
    '拒绝共享不产生旁路提示：小林端不得出现“有一条内容未分享”。',
    '亲属关系不自动等于访问权；开启后仍可撤销。',
    '不把家人绑定做成使用前提或“孝心”引导。'
  ]
});

/* 04 */
F.push({
  time:'15:04',
  who:'老人端 · 对话首页',
  title:'对话就是首页，没有待办中心',
  screen: phone(`
    ${elderTop()}
    <div class="today"><span class="tdot"></span><span>今天没有安排</span></div>
    <div class="chat">
      ${ai('陈阿姨，我在。<br>想说什么都行，不用想好怎么开头。','助理 · 刚刚')}
    </div>
    ${composer(5,'idle','点麦克风说话，也可以打字')}`),
  why:[
    '打开就是对话，不需要先理解功能分区；底部同时有文字输入和麦克风，提醒与记忆退到二级入口。',
    '“今天没有安排”如实显示为空，不用励志文案或假数据填充。',
    '不设待办中心、不显示红点，避免把陪伴变成催办。'
  ],
  edge:[
    '没有任务时首页仍然可用、可看，不以“待办数”驱动打开。',
    '不因老人没有创建任何事项而追问或反复推荐功能。',
    '右上角“我记住的事”是查看、纠正、删除的入口，不是家属档案。'
  ]
});

/* 05 */
F.push({
  time:'15:07',
  who:'老人端 · 闲聊中',
  title:'长语音不是噪声，说话时可以插话',
  screen: phone(`
    ${elderTop()}
    <div class="today"><span class="tdot"></span><span>今天没有安排</span></div>
    <div class="chat">

/* ---------------------------- 渲染 ---------------------------- */
const screenEl = document.getElementById('screen');
const notesEl  = document.getElementById('notes');
const counter  = document.getElementById('counter');
const bar      = document.getElementById('bar');
const device   = document.getElementById('device');
const wrap     = document.getElementById('wrap');
const zoomEl   = document.getElementById('zoom');
const stage    = document.querySelector('.stage');
const topbar   = document.querySelector('.topbar');
const prevBtn  = document.getElementById('prev');
const nextBtn  = document.getElementById('next');
const playBtn  = document.getElementById('play');
const notesBtn = document.getElementById('notesBtn');
const backdrop = document.getElementById('backdrop');

let i = 0;
let timer = null;
const mobile = () => window.matchMedia('(max-width:820px)').matches;

function render(){
  const f = F[i];
  screenEl.innerHTML = f.screen.split('{{T}}').join(f.time || '15:02');
  counter.textContent = `${String(i+1).padStart(2,'0')} / ${F.length}`;
  bar.style.width = ((i+1)/F.length*100).toFixed(1)+'%';
  prevBtn.disabled = i===0;
  nextBtn.disabled = i===F.length-1;
  prevBtn.style.opacity = i===0 ? .35 : 1;
  nextBtn.style.opacity = i===F.length-1 ? .35 : 1;

  notesEl.innerHTML = `
    <div class="notes-head">
      <span class="stepno">${String(i+1).padStart(2,'0')}</span>
      <div><div class="nk">${f.who}</div><h2>${f.title}</h2></div>
      <button class="nsclose" id="notesCloseTop" aria-label="收起说明">×</button>
    </div>
    <div class="nsec"><h3>设计意图</h3><ul>${f.why.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="nsec"><h3>边界与状态</h3><ul>${f.edge.map(x=>`<li>${x}</li>`).join('')}</ul></div>
    ${f.contrast ? `<div class="ncontrast">${f.contrast}</div>` : ''}
    ${f.who.indexOf('子女端')===0 ? `<div class="nsec"><h3>亲属端标签</h3>
      <div class="nlegend">
        <div><i class="sw" style="background:#2f8064"></i>妈妈原话 / 生活近况</div>
        <div><i class="sw" style="background:#2f5f8a"></i>已确认安排</div>
        <div><i class="sw" style="background:#a87b1e"></i>家庭回忆</div>
        <div><i class="sw" style="background:#b4532a"></i>明确请求</div>
        <div><i class="sw" style="background:#8b9aa7"></i>AI 整理</div>
      </div>
    </div>` : ''}
    <div class="nsec"><h3>按钮颜色约定</h3>
      <div class="nlegend">
        <div><i class="sw g"></i>是 / 同意 / 直接做</div>
        <div><i class="sw b"></i>更改 / 换个方式 / 换个时间</div>
        <div><i class="sw n"></i>否 / 不用 / 先不做</div>
      </div>
    </div>
    <p class="nfoot">证据状态：设计原型，人物、对话与时间为虚构；未实现、未验证。<br>本页不是功能清单，也不是验收通过材料。</p>`;
  if(mobile()) notesEl.insertAdjacentHTML('beforeend', '<button class="btn ghost notes-close" id="notesClose">收起说明</button>');
  notesEl.scrollTop = 0;

  const nc = document.getElementById('notesClose');
  if(nc) nc.addEventListener('click', closeNotes);
  const nt = document.getElementById('notesCloseTop');
  if(nt) nt.addEventListener('click', closeNotes);
  if(!mobile()) requestAnimationFrame(fit);
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
}

function go(n){
  i = Math.max(0, Math.min(F.length-1, n));
  render();
}
function next(){ go(i+1); }
function prev(){ go(i-1); }

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); next(); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); prev(); }
  if(e.key==='Escape'){ closeNotes(); }
});
screenEl.addEventListener('click', e=>{
  const col = e.target.closest('[data-collapse]');
  if(col){ col.closest('.shelf').classList.add('collapsed'); return; }
  const exp = e.target.closest('[data-expand]');
  if(exp){ exp.closest('.shelf').classList.remove('collapsed'); return; }
  const t = e.target.closest('[data-goto]');
  if(!t) return;
  go(parseInt(t.dataset.goto,10)-1);
});

/* 自动播放 */
playBtn.addEventListener('click', ()=>{
  if(timer){ stopPlay(); return; }
  playBtn.setAttribute('aria-pressed','true');
  playBtn.textContent = '⏸ 暂停';
  timer = setInterval(()=>{
    if(i >= F.length-1){ stopPlay(); return; }
    next();
  }, 4200);
});
function stopPlay(){
  clearInterval(timer); timer=null;
  playBtn.setAttribute('aria-pressed','false');
  playBtn.textContent = '▶ 自动';
}

/* 说明面板（手机） */
function openNotes(){ notesEl.classList.add('open'); backdrop.classList.add('open'); }
function closeNotes(){ notesEl.classList.remove('open'); backdrop.classList.remove('open'); }
notesBtn.addEventListener('click', ()=> notesEl.classList.contains('open') ? closeNotes() : openNotes());
backdrop.addEventListener('click', closeNotes);

/* 手势 */
let tx=0, ty=0;
screenEl.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; }, {passive:true});
screenEl.addEventListener('touchend', e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)>56 && Math.abs(dx)>Math.abs(dy)*1.6){ dx<0 ? next() : prev(); }
}, {passive:true});

/* 桌面缩放 */
function fit(){
  if(mobile()){ device.style.transform=''; wrap.style.width=''; wrap.style.height=''; return; }
  const W=430, H=933;
  const availH = window.innerHeight - topbar.offsetHeight - 118;
  const notesW = notesEl.offsetWidth ? notesEl.offsetWidth + 26 : 0;
  const availW = stage.clientWidth - notesW - 32;
  const s = Math.max(.4, Math.min(1, availH/H, availW/W));
  device.style.transform = `scale(${s})`;
  wrap.style.width = (W*s)+'px';
  wrap.style.height = (H*s)+'px';
  zoomEl.textContent = Math.round(s*100)+'%';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', ()=>setTimeout(fit,120));

/* 初始化 */
function fromHash(){
  const h = parseInt(location.hash.replace('#',''),10);
  if(h>=1 && h<=F.length) go(h-1);
}
window.addEventListener('hashchange', fromHash);
const hash = parseInt(location.hash.replace('#',''),10);
if(hash>=1 && hash<=F.length) i = hash-1;
render();
requestAnimationFrame(fit);
</script>
